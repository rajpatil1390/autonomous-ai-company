apiVersion: v1
kind: Secret
metadata:
  name: autonomous-ai-company-secrets
  namespace: autonomous-ai-company
  labels:
    app.kubernetes.io/name: autonomous-ai-company
    app.kubernetes.io/component: api
  annotations:
    autonomous-ai-company.example/secret-template: replace-before-apply
type: Opaque
stringData:
  ANTHROPIC_API_KEY: REPLACE_WITH_ANTHROPIC_API_KEY
  JWT_SECRET_KEY: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  POSTGRES_PASSWORD: REPLACE_WITH_POSTGRES_PASSWORD
