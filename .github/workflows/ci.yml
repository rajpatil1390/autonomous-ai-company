name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.15.20"

jobs:
  lint:
    name: Lint (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" "ruff==${RUFF_VERSION}"

      - name: Run Ruff checks
        run: |
          ruff check .
          ruff format --check .

  tests:
    name: Tests and coverage (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" "pytest-cov>=7,<8"

      - name: Run complete suite with 100 percent coverage
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          pytest \
            --junitxml=test-results/pytest.xml \
            --cov=autonomous_ai_company \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=100 \
            2>&1 | tee test-results/pytest.log

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload pytest results and log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results-python-3.12
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Build and verify package (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.3,<2"

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist

      - name: Verify installation from wheel
        shell: bash
        run: |
          WHEEL_PATH="$(find "${GITHUB_WORKSPACE}/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${WHEEL_PATH}"
          python -m venv "${RUNNER_TEMP}/wheel-verification"
          "${RUNNER_TEMP}/wheel-verification/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/wheel-verification/bin/python" -m pip install "${WHEEL_PATH}"
          "${RUNNER_TEMP}/wheel-verification/bin/python" -c \
            "from autonomous_ai_company.api.app import create_app; assert create_app().version == '1.0.0'"

      - name: Upload Python distributions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: warn
          retention-days: 14
