apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: autonomous-ai-company-api-pod-delete
  namespace: autonomous-ai-company
  labels:
    app.kubernetes.io/name: autonomous-ai-company
    app.kubernetes.io/component: chaos
    chaos.autonomous-ai-company.io/scenario: api-pod-failure
  annotations:
    chaos.autonomous-ai-company.io/safety-state: stopped
spec:
  # Safety gate 1: applying this definition cannot start an experiment.
  engineState: stop
  # Safety gate 2: an operator must explicitly annotate the chosen target pod.
  annotationCheck: "true"
  appinfo:
    appns: autonomous-ai-company
    applabel: app.kubernetes.io/name=autonomous-ai-company,app.kubernetes.io/component=api
    appkind: deployment
  chaosServiceAccount: litmus-chaos-runner
  jobCleanUpPolicy: retain
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TARGET_CONTAINER
              value: api
            - name: TOTAL_CHAOS_DURATION
              value: "30"
            - name: CHAOS_INTERVAL
              value: "30"
            - name: FORCE
              value: "false"
            - name: PODS_AFFECTED_PERC
              value: "50"
            - name: SEQUENCE
              value: serial
            - name: RAMP_TIME
              value: "10"

