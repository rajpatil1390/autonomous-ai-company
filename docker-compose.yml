name: autonomous-ai-company

services:
  api:
    image: autonomous-ai-company-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    init: true
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}"
      MODEL_NAME: "${MODEL_NAME:?MODEL_NAME is required}"
      TEMPERATURE: "${TEMPERATURE:-0.2}"
      MAX_TOKENS: "${MAX_TOKENS:-4096}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      CHECKPOINTING_ENABLED: "${CHECKPOINTING_ENABLED:-false}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
      POSTGRES_ENABLED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: "${POSTGRES_DATABASE:-autonomous_ai_company}"
      POSTGRES_USER: "${POSTGRES_USER:-autonomous_ai_company}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      APP_WORKERS: "${APP_WORKERS:-2}"
      UVICORN_LOG_LEVEL: "${UVICORN_LOG_LEVEL:-info}"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen(
          f'http://127.0.0.1:{os.environ.get("APP_PORT", "8000")}/health',
          timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DATABASE:-autonomous_ai_company}"
      POSTGRES_USER: "${POSTGRES_USER:-autonomous_ai_company}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/autonomous_ai_company/audit/schema.sql:/docker-entrypoint-initdb.d/001-audit-schema.sql:ro
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  postgres_data:
    name: autonomous_ai_company_postgres_data
