[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-ai-company"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116,<1.0",
    "bcrypt>=4.0.1,<4.1",
    "fastapi>=0.116,<1.0",
    "langgraph>=1.0,<2.0",
    "mlflow>=3.14,<4.0",
    "httpx>=0.28,<1.0",
    "openai>=2.0,<3.0",
    "opentelemetry-api>=1.43,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43,<2.0",
    "opentelemetry-sdk>=1.43,<2.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "prometheus-client>=0.25,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-jose[cryptography]>=3.5,<4.0",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0,<10.0",
    "testcontainers[postgres]>=4.10,<5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["autonomous_ai_company*"]

[tool.setuptools.package-data]
"autonomous_ai_company.audit" = ["schema.sql"]
