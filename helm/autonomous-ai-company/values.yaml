namespace:
  create: true
  name: autonomous-ai-company

image:
  repository: autonomous-ai-company-api
  tag: local
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: autonomous-ai-company.example.com
  tlsSecretName: autonomous-ai-company-tls

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 20Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

networkPolicy:
  enabled: true

config:
  MODEL_NAME: claude-sonnet-4-5-20250929
  TEMPERATURE: "0.2"
  MAX_TOKENS: "4096"
  LOG_LEVEL: INFO
  CHECKPOINTING_ENABLED: "false"
  POSTGRES_ENABLED: "false"
  POSTGRES_HOST: postgresql
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: autonomous_ai_company
  POSTGRES_USER: autonomous_ai_company
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  MLFLOW_ENABLED: "false"
  MLFLOW_EXPERIMENT_NAME: autonomous-ai-company
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: autonomous-ai-company
  OTEL_EXPORTER: console
  METRICS_ENABLED: "true"
  METRICS_NAMESPACE: autonomous_ai_company
  METRICS_SUBSYSTEM: ""
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  APP_WORKERS: "2"
  UVICORN_LOG_LEVEL: info

secret:
  createExample: false
  name: autonomous-ai-company-secrets
  exampleData:
    ANTHROPIC_API_KEY: REPLACE_WITH_ANTHROPIC_API_KEY
    JWT_SECRET_KEY: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
    POSTGRES_PASSWORD: REPLACE_WITH_POSTGRES_PASSWORD

