replicaCount: 2

image:
  tag: staging
  pullPolicy: IfNotPresent

ingress:
  host: staging.autonomous-ai-company.example.com
  tlsSecretName: autonomous-ai-company-staging-tls

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false

