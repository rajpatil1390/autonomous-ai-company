apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "autonomous-ai-company.configMapName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ include "autonomous-ai-company.name" . }}
    app.kubernetes.io/component: api
data:
  MODEL_NAME: {{ .Values.config.MODEL_NAME | quote }}
  TEMPERATURE: {{ .Values.config.TEMPERATURE | quote }}
  MAX_TOKENS: {{ .Values.config.MAX_TOKENS | quote }}
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL | quote }}
  CHECKPOINTING_ENABLED: {{ .Values.config.CHECKPOINTING_ENABLED | quote }}
  POSTGRES_ENABLED: {{ .Values.config.POSTGRES_ENABLED | quote }}
  POSTGRES_HOST: {{ .Values.config.POSTGRES_HOST | quote }}
  POSTGRES_PORT: {{ .Values.config.POSTGRES_PORT | quote }}
  POSTGRES_DATABASE: {{ .Values.config.POSTGRES_DATABASE | quote }}
  POSTGRES_USER: {{ .Values.config.POSTGRES_USER | quote }}
  JWT_ALGORITHM: {{ .Values.config.JWT_ALGORITHM | quote }}
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.config.ACCESS_TOKEN_EXPIRE_MINUTES | quote }}
  MLFLOW_ENABLED: {{ .Values.config.MLFLOW_ENABLED | quote }}
  MLFLOW_EXPERIMENT_NAME: {{ .Values.config.MLFLOW_EXPERIMENT_NAME | quote }}
  OTEL_ENABLED: {{ .Values.config.OTEL_ENABLED | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.OTEL_SERVICE_NAME | quote }}
  OTEL_EXPORTER: {{ .Values.config.OTEL_EXPORTER | quote }}
  METRICS_ENABLED: {{ .Values.config.METRICS_ENABLED | quote }}
  METRICS_NAMESPACE: {{ .Values.config.METRICS_NAMESPACE | quote }}
  METRICS_SUBSYSTEM: {{ .Values.config.METRICS_SUBSYSTEM | quote }}
  APP_HOST: {{ .Values.config.APP_HOST | quote }}
  APP_PORT: {{ .Values.config.APP_PORT | quote }}
  APP_WORKERS: {{ .Values.config.APP_WORKERS | quote }}
  UVICORN_LOG_LEVEL: {{ .Values.config.UVICORN_LOG_LEVEL | quote }}

