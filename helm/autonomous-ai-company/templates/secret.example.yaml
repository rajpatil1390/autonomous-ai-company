{{- if .Values.secret.createExample }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ include "autonomous-ai-company.name" . }}
    app.kubernetes.io/component: api
  annotations:
    autonomous-ai-company.example/secret-template: replace-before-apply
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secret.exampleData.ANTHROPIC_API_KEY | quote }}
  JWT_SECRET_KEY: {{ .Values.secret.exampleData.JWT_SECRET_KEY | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.exampleData.POSTGRES_PASSWORD | quote }}
{{- end }}

