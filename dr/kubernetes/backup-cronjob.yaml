apiVersion: batch/v1
kind: CronJob
metadata:
  name: autonomous-ai-company-postgres-backup
  namespace: autonomous-ai-company
  labels:
    app.kubernetes.io/name: autonomous-ai-company
    app.kubernetes.io/component: disaster-recovery
  annotations:
    dr.autonomous-ai-company.io/safety-state: configure-before-enabling
spec:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  # The daily schedule is defined, but execution remains opt-in until the image,
  # PVC, secret, encryption wrapper, and restore validation have been reviewed.
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: autonomous-ai-company
            app.kubernetes.io/component: disaster-recovery
            dr.autonomous-ai-company.io/task: postgres-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: postgres-backup
              image: REPLACE_WITH_PINNED_BACKUP_IMAGE
              imagePullPolicy: IfNotPresent
              command:
                - /opt/dr/postgres-backup.sh
              env:
                - name: POSTGRES_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: autonomous-ai-company-dr-config
                      key: POSTGRES_HOST
                - name: POSTGRES_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: autonomous-ai-company-dr-config
                      key: POSTGRES_PORT
                - name: POSTGRES_DATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: autonomous-ai-company-dr-config
                      key: POSTGRES_DATABASE
                - name: POSTGRES_USER
                  valueFrom:
                    configMapKeyRef:
                      name: autonomous-ai-company-dr-config
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: autonomous-ai-company-dr-secrets
                      key: POSTGRES_PASSWORD
                - name: BACKUP_OUTPUT_DIR
                  value: /backups
                - name: BACKUP_RETENTION_DAYS
                  value: "35"
                - name: REQUIRE_BACKUP_ENCRYPTION
                  value: "true"
                - name: BACKUP_ENCRYPTION_PROGRAM
                  valueFrom:
                    configMapKeyRef:
                      name: autonomous-ai-company-dr-config
                      key: BACKUP_ENCRYPTION_PROGRAM
                - name: PGCONNECT_TIMEOUT
                  value: "10"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: temporary-files
                  mountPath: /tmp
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: REPLACE_WITH_BACKUP_PVC_NAME
            - name: temporary-files
              emptyDir:
                sizeLimit: 1Gi

