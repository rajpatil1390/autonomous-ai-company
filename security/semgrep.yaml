rules:
  - id: autonomous-ai-company.python.dynamic-code-execution
    message: Dynamic code execution is forbidden in production Python.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: autonomous-ai-company.python.subprocess-shell
    message: Avoid shell=True; pass an argument sequence to subprocess instead.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      confidence: HIGH
    pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: autonomous-ai-company.python.disabled-tls-verification
    message: TLS certificate verification must not be disabled.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      confidence: HIGH
    pattern: requests.$METHOD(..., verify=False, ...)

  - id: autonomous-ai-company.python.unsafe-yaml-load
    message: Use yaml.safe_load for data that is not fully trusted.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      confidence: HIGH
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)

  - id: autonomous-ai-company.python.weak-hash-security-context
    message: MD5 and SHA-1 must not be used for security-sensitive hashing.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

